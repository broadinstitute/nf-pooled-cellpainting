name: pre-commit linting
# This workflow is triggered on pushes and PRs to the repository.
# It runs pre-commit checks to ensure code quality.
on:
  pull_request:
  # Also lint the integration branches themselves. Without this, an unformatted
  # file merged into dev is never linted directly and instead fails the next
  # unrelated pull request, which lints the merge of dev and that PR.
  push:
    branches:
      - dev
      - main
  release:
    types: [published]

# Least privilege: this workflow runs pre-commit hooks defined by the pull
# request, so its token must not be able to write to the repository.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
