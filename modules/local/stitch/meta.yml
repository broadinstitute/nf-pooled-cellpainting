# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "stitch"
description: Stitch multi-site microscopy images into a full-well image using a Python script
keywords:
  - microscopy
  - image processing
  - stitching
tools:
  - "stitch":
      description: "Pipeline-local Python stitching script (bin/stitch.py)"
      homepage: "https://github.com/broadinstitute/nf-pooled-cellpainting"
      documentation: "https://github.com/broadinstitute/nf-pooled-cellpainting"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', batch:'Batch1', plate:'Plate1', well:'A1' ]`
    - corrected_images:
        type: file
        description: Illumination-corrected TIFF images from multiple sites for one well
        pattern: "*.{tif,tiff}"
        ontologies:
          - edam: http://edamontology.org/format_3547
  - well_site_layouts_json:
      type: file
      description: Shared site-position layouts for round-well acquisitions (assets/stitchcrop/well_site_layouts.json), also used by the legacy Fiji stitcher
      pattern: "*.json"
      ontologies:
        - edam: http://edamontology.org/format_3464
  - round_or_square:
      type: string
      description: Acquisition pattern shape (round or square)
  - quarter_if_round:
      type: string
      description: Which quarter of the round pattern to process
  - overlap_pct:
      type: float
      description: Percentage of overlap between adjacent tiles
  - imperwell:
      type: integer
      description: Number of images per well
  - rows:
      type: integer
      description: Number of rows in the acquisition grid
  - columns:
      type: integer
      description: Number of columns in the acquisition grid
  - stitchorder:
      type: string
      description: Order in which to stitch tiles
  - compress:
      type: boolean
      description: Whether to compress output images
  - phenix:
      type: boolean
      description: Whether the first site is centered in the well (Phenix acquisition pattern) or in the upper left corner (non-Phenix)
  - channame:
      type: string
      description: Reference channel substring used for shape/dtype detection and (for barcoding/multicycle painting) cycle-registration

output:
  - stitched_images:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', batch:'Batch1', plate:'Plate1', well:'A1' ]`
      - "*.tiff":
          type: file
          description: Stitched full-well microscopy images created by combining multiple site images
          pattern: "stitched_images/*.{tif,tiff}"
          ontologies:
            - edam: http://edamontology.org/format_3547
  - tile_config:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', batch:'Batch1', plate:'Plate1', well:'A1' ]`
      - "TileConfiguration*.txt":
          type: file
          description: Optional tile registration/configuration file containing image positions
          pattern: "stitched_images/TileConfiguration*.txt"
          ontologies:
            - edam: http://edamontology.org/format_2330
  - downsampled_images:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', batch:'Batch1', plate:'Plate1', well:'A1' ]`
      - "*.tiff":
          type: file
          description: Downsampled (10x) versions of stitched images for quality control and visualization
          pattern: "downsampled_images/*.{tif,tiff}"
          ontologies:
            - edam: http://edamontology.org/format_3547
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
          ontologies:
            - edam: http://edamontology.org/format_3750

authors:
  - "@ErinWeisbart"
maintainers:
  - "@ErinWeisbart"
