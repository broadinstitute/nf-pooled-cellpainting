# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "crop"
description: Crop a full-well stitched microscopy image into per-site tiles using a Python script
keywords:
  - microscopy
  - image processing
  - cropping
tools:
  - "crop":
      description: "Pipeline-local Python cropping script (bin/crop.py)"
      homepage: "https://github.com/broadinstitute/nf-pooled-cellpainting"
      documentation: "https://github.com/broadinstitute/nf-pooled-cellpainting"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', batch:'Batch1', plate:'Plate1', well:'A1' ]`
    - stitched_images:
        type: file
        description: Full-well stitched (and, upstream of this module, aligned) TIFF images
        pattern: "*.{tif,tiff}"
        ontologies:
          - edam: http://edamontology.org/format_3547
  - tileperside:
      type: integer
      description: Number of tiles per side of the grid
  - final_tile_size:
      type: integer
      description: Final size of each tile after cropping (in pixels)
  - compress:
      type: boolean
      description: Whether to compress output images
  - phenix:
      type: boolean
      description: Accepted for interface parity with the legacy Fiji script; unused here - tile numbering is a plain column-major grid regardless of acquisition geometry, since cropping happens after stitching
  - channame:
      type: string
      description: Accepted for interface parity with the legacy Fiji script; unused here - every channel file is cropped independently with the same grid

output:
  - cropped_images:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', batch:'Batch1', plate:'Plate1', well:'A1' ]`
      - "*.tiff":
          type: file
          description: Cropped per-site tile images extracted from the stitched well image
          pattern: "cropped_images/**.{tif,tiff}"
          ontologies:
            - edam: http://edamontology.org/format_3547
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
          ontologies:
            - edam: http://edamontology.org/format_3750

authors:
  - "@ErinWeisbart"
maintainers:
  - "@ErinWeisbart"
